<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-accent="zhusha">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>诗笺 · 唐诗三百首</title>
  <link rel="icon" type="image/svg+xml" href="../logo.svg">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app-shell">
    <div class="ambient ambient-a"></div>
    <div class="ambient ambient-b"></div>
    <div class="paper-grain"></div>

    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">
          <svg viewBox="0 0 64 64" width="26" height="26" aria-hidden="true">
            <rect x="16" y="6" width="32" height="52" rx="3" fill="none" stroke="currentColor" stroke-width="3"/>
            <rect x="12" y="6" width="5" height="52" rx="2.5" fill="currentColor" opacity=".9"/>
            <rect x="47" y="6" width="5" height="52" rx="2.5" fill="currentColor" opacity=".9"/>
            <path d="M24 20h16M24 27h16M24 34h10" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/>
            <circle cx="38" cy="46" r="4.5" fill="currentColor" opacity=".85"/>
          </svg>
        </div>
        <div class="brand-text"><strong>诗笺</strong><span>POEM SCROLL</span></div>
      </div>

      <nav class="nav" id="nav" aria-label="主导航"></nav>

      <div class="sidebar-foot">
        <div class="privacy-badge">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <span data-i18n="privacy.offline">本机存储 · 完全离线</span>
        </div>
        <span class="side-version" id="side-version"></span>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-title">
          <h1 id="page-title">今日</h1>
          <p id="page-sub">一首诗，翻开今天</p>
        </div>
        <div class="topbar-actions" id="topbar-actions"></div>
      </header>
      <section id="view" class="view" tabindex="-1"></section>
    </main>
  </div>

  <div id="toast-root" class="toast-root"></div>

  <script src="js/util.js"></script>
  <script src="js/bridge.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/views/today.js"></script>
  <script src="js/views/poems.js"></script>
  <script src="js/views/poet.js"></script>
  <script src="js/views/reader.js"></script>
  <script src="js/views/search.js"></script>
  <script src="js/views/favorites.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/views/about.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
